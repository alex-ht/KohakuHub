; Supervisord config for KohakuHub All-in-One container
; Runs: MinIO + LakeFS + Nginx + API (uvicorn via startup.py)
; All long-running services are managed here.

[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
pidfile=/tmp/supervisord.pid
loglevel=info

; ==========================================
; MinIO (S3-compatible storage)
; ==========================================
[program:minio]
command=/usr/local/bin/minio server /data/minio --address ":9000" --console-address ":29000"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/data/logs/minio.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/data/logs/minio-error.log
environment=MINIO_ROOT_USER=%(ENV_MINIO_ROOT_USER)s,MINIO_ROOT_PASSWORD=%(ENV_MINIO_ROOT_PASSWORD)s,MINIO_API_CORS_ALLOW_ORIGIN=*

; ==========================================
; LakeFS (data versioning)
; ==========================================
[program:lakefs]
command=/usr/local/bin/lakefs run
autostart=true
autorestart=true
startretries=5
stdout_logfile=/data/logs/lakefs.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/data/logs/lakefs-error.log
; LakeFS envs are passed from container environment (set in entrypoint or docker run)
; Important ones: LAKEFS_DATABASE_TYPE, LAKEFS_BLOCKSTORE_*, LAKEFS_AUTH_*, LAKEFS_LISTEN_ADDRESS

; ==========================================
; Nginx (frontend + API reverse proxy)
; ==========================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off; error_log /data/logs/nginx-error.log;"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/data/logs/nginx.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/data/logs/nginx-error.log

; ==========================================
; KohakuHub API (via startup.py which handles
; waiting for lakefs, credential setup, migrations, uvicorn)
; ==========================================
[program:api]
command=/app/startup.py
autostart=true
autorestart=true
startretries=3
stdout_logfile=/data/logs/api.log
stdout_logfile_maxbytes=50MB
stderr_logfile=/data/logs/api-error.log
; The startup.py will read env vars for config, S3, LakeFS, etc.

; Optional: a simple health aggregator or just rely on individual logs
; You can `docker logs <container>` or check /data/logs/
