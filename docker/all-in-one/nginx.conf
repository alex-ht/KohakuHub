# All-in-One nginx config for KohakuHub
# Proxies to localhost services inside the same container.
# Based on docker/nginx/default.conf

log_format debug_log '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_agent" '
                     'location="$location_name"';

server {
    listen 80;
    server_name localhost;

    # Allow large client request bodies for file uploads
    client_max_body_size 100G;

    root /usr/share/nginx/html;
    index index.html;

    set $location_name "unknown";

    access_log /var/log/nginx/access.log debug_log;

    # =================================================================
    # API PROXY RULES (order matters - most specific first)
    # =================================================================

    location /api/ {
        set $location_name "api";
        proxy_pass http://127.0.0.1:48888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/api/ {
        set $location_name "admin_api";
        proxy_pass http://127.0.0.1:48888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /org/ {
        set $location_name "org_api";
        proxy_pass http://127.0.0.1:48888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Git HTTP Smart Protocol
    location ~ \.git/(info/refs|git-upload-pack|git-receive-pack|HEAD) {
        set $location_name "git_http";
        proxy_pass http://127.0.0.1:48888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_set_header Content-Type $content_type;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Accel-Buffering "no" always;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
    }

    # Git LFS
    location ~ \.git/info/lfs/ {
        set $location_name "git_lfs";
        proxy_pass http://127.0.0.1:48888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_body_buffer_size 128k;
    }

    # Public resolve routes
    location ~ ^/(models|datasets|spaces)/[^/]+/[^/]+/resolve/ {
        set $location_name "public_resolve_typed";
        proxy_pass http://127.0.0.1:48888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/[^/]+/[^/]+/resolve/ {
        set $location_name "public_resolve_legacy";
        proxy_pass http://127.0.0.1:48888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA
    location /admin {
        set $location_name "admin_spa";
        alias /usr/share/nginx/html-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Main SPA fallback
    location / {
        set $location_name "main_spa";
        try_files $uri $uri/ /index.html;
    }
}
